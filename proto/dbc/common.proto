syntax = "proto3";
package dbc;

// Severity of a parse-time diagnostic. Emitted only on lossy or guessed events,
// never for losslessly-preserved content.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  WARNING = 1;   // value defaulted / truncated / out of enum range
  DROPPED = 2;   // whole record or section skipped
}

// A single parse-time diagnostic. `location` is the best available position
// (line number, section path, or block name).
message Diagnostic {
  string location = 1;
  string message = 2;
  Severity severity = 3;
}

enum ByteOrder {
  BYTE_ORDER_UNSPECIFIED = 0;
  BYTE_ORDER_LITTLE_ENDIAN = 1;  // Intel, @1
  BYTE_ORDER_BIG_ENDIAN = 2;     // Motorola, @0
}

enum ValueType {
  VALUE_TYPE_UNSPECIFIED = 0;
  VALUE_TYPE_INTEGER = 1;         // signed or unsigned (default)
  VALUE_TYPE_FLOAT32 = 2;         // IEEE 754 single
  VALUE_TYPE_FLOAT64 = 3;         // IEEE 754 double
}

enum MultiplexType {
  MULTIPLEX_NONE = 0;
  MULTIPLEX_MULTIPLEXOR = 1;      // M - this signal is the mux selector
  MULTIPLEX_MULTIPLEXED = 2;      // m<N> - conditional on mux value
  MULTIPLEX_MULTIPLEXED_AND_MULTIPLEXOR = 3;  // m<N>M - both roles (extended mux)
}

enum AttributeValueType {
  ATTR_TYPE_UNSPECIFIED = 0;
  ATTR_TYPE_INT = 1;
  ATTR_TYPE_FLOAT = 2;
  ATTR_TYPE_STRING = 3;
  ATTR_TYPE_ENUM = 4;
  ATTR_TYPE_HEX = 5;
}

enum AttributeScope {
  ATTR_SCOPE_UNSPECIFIED = 0;
  ATTR_SCOPE_GLOBAL = 1;
  ATTR_SCOPE_NODE = 2;
  ATTR_SCOPE_MESSAGE = 3;
  ATTR_SCOPE_SIGNAL = 4;
  ATTR_SCOPE_ENV_VAR = 5;   // BA_ ... EV_ <env var name>
}

enum EnvironmentVariableType {
  ENV_VAR_TYPE_UNSPECIFIED = 0;
  ENV_VAR_TYPE_INTEGER = 1;     // type 0 in DBC
  ENV_VAR_TYPE_FLOAT = 2;       // type 1 in DBC
  ENV_VAR_TYPE_STRING = 3;      // type 2 in DBC
}

enum RelationalAttributeScope {
  REL_ATTR_SCOPE_UNSPECIFIED = 0;
  REL_ATTR_SCOPE_BU_SG_REL = 1;  // node-to-signal
  REL_ATTR_SCOPE_BU_BO_REL = 2;  // node-to-message
}

// Semantic-validation check that produced a ValidationFinding. Reported by the
// opt-in dbc::extract::validate() pass over a cleanly parsed file; independent
// of the parse-lossiness Severity/Diagnostic channel above.
enum ValidationCheck {
  VALIDATION_CHECK_UNSPECIFIED = 0;
  SIGNAL_OVERLAP = 1;          // two non-exclusive signals claim the same bits
  SIGNAL_EXCEEDS_DLC = 2;      // a signal decodes past the frame payload
  DUPLICATE_MESSAGE_ID = 3;    // two messages share (id, is_extended_id)
  MISSING_RECEIVER_NODE = 4;   // a receiver is not declared in BU_
}

// Severity of a ValidationFinding. Distinct from the parse-time Severity enum:
// carries ERROR (decode-affecting) which the parse channel never needs.
enum FindingSeverity {
  FINDING_SEVERITY_UNSPECIFIED = 0;
  FINDING_WARNING = 1;   // consistency defect, decode unaffected
  FINDING_ERROR = 2;     // decode-affecting defect
}
